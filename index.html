<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gebetszeiten</title>
<meta name="description" content="Gebetszeiten für deinen Standort – mit Benachrichtigungen, Muslim World League oder offiziellen Diyanet-Zeiten.">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)" id="tcLight">
<meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)" id="tcDark">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gebetszeiten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script>try{var t=JSON.parse(localStorage.getItem("gz-state-v2")||"{}").theme;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="wrap">

  <!-- Erster Start: Erlaubnisse -->
  <section id="onboarding" class="onboarding" hidden>
    <div class="ob-head">
      <img src="icons/icon.svg" alt="" width="72" height="72" class="ob-icon">
      <h1 data-t="welcome">Willkommen</h1>
      <p class="muted" data-t="welcomeText"></p>
    </div>
    <div class="panel ob-card">
      <div class="ob-row">
        <span class="ob-ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <span><strong data-t="location">Standort</strong><span class="small muted" data-t="locationWhy"></span></span>
      </div>
      <button type="button" class="btn primary" id="obLocation" data-t="allowLocation">Standort erlauben</button>
      <button type="button" class="btn link" id="obManual" data-t="manualInstead">Ort lieber manuell suchen</button>
      <p class="small ok" id="obLocationState" hidden></p>
    </div>
    <div class="panel ob-card">
      <div class="ob-row">
        <span class="ob-ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></span>
        <span><strong data-t="notifications">Benachrichtigungen</strong><span class="small muted" data-t="notifWhy"></span></span>
      </div>
      <button type="button" class="btn outline" id="obNotif" data-t="notifEnable">Benachrichtigungen erlauben</button>
      <p class="small muted" id="obNotifState" hidden></p>
    </div>
    <p class="hint small" data-ios-hint data-t="iosHint" hidden></p>
    <button type="button" class="btn link muted" id="obDone" data-t="later">Später</button>
  </section>

  <!-- Hauptansicht -->
  <main id="main" hidden>
   <div class="view" id="viewTimes">
    <header>
      <div class="eyebrow" id="today"></div>
      <div class="brand"><img src="icons/icon.svg" alt="" width="44" height="44"><h1 data-t="appTitle">Gebetszeiten</h1></div>
      <div class="hijri" id="hijri"></div>
    </header>

    <section class="next" aria-live="polite">
      <span class="lbl" id="nextLbl"></span>
      <span class="name" id="nextName">–</span>
      <span class="time" id="nextTime">–</span>
      <span class="cd" id="nextCd"></span>
    </section>

    <section class="panel" aria-labelledby="h-today">
      <div class="panel-head">
        <h2 id="h-today" data-t="today">Heute</h2>
        <span class="src" id="locSummary"></span>
      </div>
      <ul class="times" id="times"></ul>
    </section>
    <p class="foot" id="foot"></p>
   </div>

   <!-- Qibla -->
   <div class="view" id="viewQibla" hidden>
    <header>
      <div class="eyebrow"><span data-t="qibla">Qibla</span> · <span lang="ar" class="ar-inline">القبلة</span></div>
      <h1 data-t="qiblaTitle">Gebetsrichtung</h1>
      <div class="hijri" id="qDistance"></div>
    </header>
    <section class="panel qibla-card">
      <svg id="compass" viewBox="0 -16 300 316" role="img" aria-labelledby="qStatus">
        <path id="qMark" d="M150 -14 L160 4 L140 4 Z"/>
        <circle id="qDisc" cx="150" cy="150" r="140"/>
        <g id="qDial">
          <g id="qTicks"></g>
          <g id="qLetters"></g>
          <g id="qArrowGroup">
            <path id="qArrow" d="M150 52 L176 120 L156 112 L156 196 L144 196 L144 112 L124 120 Z"/>
            <g transform="translate(150 12)">
              <circle class="kaaba-bg" r="18"/>
              <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#1B2220"/>
              <rect x="-8" y="-3.5" width="16" height="3" fill="#C9952E"/>
            </g>
          </g>
        </g>
        <circle id="qHub" cx="150" cy="150" r="9"/>
      </svg>
      <div class="q-status">
        <span id="qStatus"></span>
        <span class="small muted" id="qSub"></span>
      </div>
      <button type="button" class="btn primary" id="btnCompass" data-t="compassStart" hidden>Kompass starten</button>
    </section>
    <section class="panel q-values">
      <div><span class="small muted" data-t="qibla">Qibla</span><span class="mono" id="qBearing">–</span></div>
      <div><span class="small muted" data-t="phoneHeading">Handy zeigt</span><span class="mono" id="qHeading">–</span></div>
    </section>
    <p class="foot"><span id="qDecl"></span><br><span data-t="qiblaHint"></span></p>
   </div>

   <!-- Einstellungen -->
   <div class="view" id="viewSettings" hidden>
    <h1 data-t="settings">Einstellungen</h1>
    <section class="panel">
      <div class="settings">
        <div class="set">
          <span class="t" data-t="location">Standort</span>
          <div class="loc-row">
            <span class="loc-text"><strong id="locName">–</strong><span class="small muted" id="locState"></span></span>
            <span class="live" id="locLive" hidden><span class="dot"></span><span data-t="live">Live</span></span>
          </div>
          <div class="chips">
            <button type="button" class="chip" id="btnGps" data-t="useGps">Standort verwenden</button>
            <button type="button" class="chip" id="btnSearch" data-t="searchPlace">Ort suchen</button>
          </div>
          <form class="search" id="searchForm" hidden>
            <label class="sr-only" for="searchInput" data-t="searchPlace">Ort suchen</label>
            <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search">
            <button type="submit" class="chip" data-t="search">Suchen</button>
          </form>
          <ul class="results" id="searchResults" hidden></ul>
        </div>
        <div class="set">
          <span class="t" data-t="method">Methode</span>
          <div class="chips" id="methodChips" role="group"></div>
        </div>
        <div class="set">
          <span class="t" data-t="theme">Design</span>
          <div class="chips" id="themeChips" role="group">
            <button type="button" class="chip" data-theme-choice="system" data-t="themeSystem">System</button>
            <button type="button" class="chip" data-theme-choice="light" data-t="themeLight">Hell</button>
            <button type="button" class="chip" data-theme-choice="dark" data-t="themeDark">Dunkel</button>
          </div>
        </div>
        <div class="set">
          <span class="t" data-t="language">Sprache</span>
          <div class="chips" id="langChips" role="group"></div>
        </div>
        <div class="set">
          <span class="t" data-t="notifications">Benachrichtigungen</span>
          <span class="small muted" id="notifState"></span>
          <div class="chips">
            <button type="button" class="chip" id="btnNotif" data-t="notifEnable" hidden>Benachrichtigungen erlauben</button>
            <button type="button" class="chip" id="btnTest" data-t="notifTest" hidden>Test senden</button>
          </div>
          <span class="small" id="testResult" role="status" hidden></span>
          <p class="hint small" data-ios-hint data-t="iosHint" hidden></p>
        </div>
      </div>
    </section>
   </div>

   <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="times" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-t="tabTimes">Gebetszeiten</span></button>
    <button type="button" data-tab="qibla"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span data-t="tabQibla">Qibla</span></button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="settings">Einstellungen</span></button>
   </nav>
  </main>
</div>
</body>
</html>
