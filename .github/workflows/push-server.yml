name: Push-Server einrichten / aktualisieren

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "js/praytimes.js"
      - "js/i18n.js"
      - "js/diyanet.js"

permissions:
  contents: write
  actions: write

concurrency:
  group: push-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets vorhanden?
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen (Settings → Secrets and variables → Actions). Siehe README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Einrichten und veröffentlichen
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          node scripts/setup.mjs
      - name: Worker-Adresse in die App übernehmen
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -- worker/wrangler.toml
          if git diff --quiet -- js/config.js; then
            echo "js/config.js unverändert"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/config.js
            git commit -m "Push-Server-Adresse eintragen"
            git push
            gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
          fi
